name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          cp target/x86_64-unknown-linux-gnu/release/obsctl obsctl
          tar -czf obsctl-${{ github.ref_name }}-linux-amd64.tar.gz obsctl
          sha256sum obsctl-${{ github.ref_name }}-linux-amd64.tar.gz > obsctl-${{ github.ref_name }}-linux-amd64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsctl-${{ github.ref_name }}-linux-amd64.tar.gz
            obsctl-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
            scripts/install.sh
          generate_release_notes: true
