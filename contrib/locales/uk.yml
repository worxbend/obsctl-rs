      hint_scenes_ascii: "jk рух | t сховати/показати | n перейменувати | Enter зберегти | Esc назад"
      hint_naming: "введіть назву · ↵ підтвердити · esc скасувати"
      hint_naming_ascii: "введіть назву | Enter підтвердити | Esc скасувати"
      state_hidden: "приховано"
      state_visible: "видимо"
