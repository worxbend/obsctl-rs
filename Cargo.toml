[package]
name = "obsctl-rs"
version = "0.6.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "obsctl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "5"
rand = "0.8"
time = { version = "0.3", features = ["serde", "macros"] }
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
rust-i18n = "4"
rattles = "0.3.1"
ratatui-braille-bar = "0.3.0"
# Already in the tree via ratatui; named directly so widgets can measure text
# in terminal cells rather than characters when centering and truncating.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
