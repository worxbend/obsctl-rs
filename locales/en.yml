# Default English strings, embedded into the obsctl binary at compile time.
#
# This file is the ultimate fallback: if no locale override files are found
# under `<config_dir>/locales/`, these strings are always used regardless of
# the configured `ui.locale`. See contrib/locales/uk.yml for the Ukrainian
# translation shipped alongside the binary (copy it into `<config_dir>/locales/`
# to enable it) and README.md's "Localization" section for details.

common:
  error: "error: %{message}"
  warning: "warning: %{message}"

cli:
  config:
    load_failed: "failed to load config: %{error}"

  init:
    no_config_dir: "could not determine config directory"
    already_exists: "Config already exists at %{path}. Use --force to overwrite."
    success: "Initialized config at %{path}"

  validate:
    no_config_path: "could not determine config path"
    valid: "Config is valid."
    valid_with_warnings: "Config is valid with %{count} warning(s)."

  setup:
    no_config_found: "No config found at %{path}."
    create_minimal: "Let's create a minimal config.\n\n"
    failed: "Setup failed: %{error}"
    written: "\nConfig written to %{path}.\n\n"
    prompt_host: "OBS host"
    prompt_port: "OBS port"
    prompt_password: "OBS WebSocket password (blank = no auth)"
    port_out_of_range: "  Port must be in range 1-65535."
    port_invalid: "  Invalid port, enter an integer 1-65535."

  tui:
    error: "tui error: %{error}"

  runtime:
    async_start_failed: "failed to start async runtime for %{context}: %{error}"

  service:
    no_unit_dir: "could not determine systemd user unit directory"
    exec_path_unresolved: "could not determine executable path: %{error}"
    installed: "Service installed at %{path}"
    enable_hint: "Enable with: %{hint}"
    uninstalled: "Service uninstalled."
    action_started: "Service started."
    action_stopped: "Service stopped."
    action_restarted: "Service restarted."

  proxy:
    unsupported_command: "command %{command} is not supported for server proxying"

  client:
    server_unavailable_intro: "obsctl server is not running."
    server_unavailable_start: "Start it with:"
    server_unavailable_or_install: "Or install the service:"
    unexpected_event: "unexpected event instead of response"
    json_encode_warning: "failed to encode JSON output: %{error}"
    error_with_code: "error [%{code}]: %{message}"

tui:
  status:
    title: "STATUS"
    idle_hint: "standing by"

  splash:
    preparing: "Preparing..."
    tagline: "Broadcast control, without breaking flow."
    description: "Scenes, audio, profiles, recording, and live telemetry — one command center."
    description_ascii: "Scenes, audio, profiles, recording, and live telemetry."
    initializing_title: "INITIALIZING BROADCAST CONTROL"
    startup_title_ascii: " OBSCTL STARTUP "
    studio_link_title: " STUDIO LINK // SECURE SESSION "
    initializing_studio_link: "%{tick} initializing studio link"
    boot_loading: "loading control surfaces"
    boot_warming: "warming animation engine"
    boot_syncing: "syncing OBS telemetry"
    boot_painting: "painting command center"
    boot_ready: "ready"

  header:
    title: " ◈ OBSCTL // BROADCAST COMMAND CENTER "
    title_ascii: " OBSCTL // BROADCAST COMMAND CENTER "
    subtitle: "  studio automation console"
    daemon_connected: "daemon: connected"
    daemon_disconnected: "daemon: disconnected"
    obs_connected: "OBS: connected (v%{version})"
    obs_disconnected: "OBS: disconnected"
    scene: "  scene: %{scene}"
    profile: "  profile: %{profile}"

  events:
    undecodable_state: "Ignored a state update this build cannot read: %{error}"
    undecodable_log: "Ignored an unreadable log event: %{error}"
    undecodable_event: "Ignored an unreadable OBS event: %{error}"

  connection:
    daemon_not_running: "obsctl server is not running"
    could_not_connect: "Could not connect to obsctl daemon."
    start_daemon_with: "Start the daemon with:"
    or_install_service: "Or install the service:"
    press_r_to_retry: "Press R to retry, q to quit."
    not_connected: "Not connected to obsctl daemon."
    obs_connected: "OBS: connected"
    obs_disconnected: "OBS: disconnected"
    last_error: "last error: %{error}"
    waiting_for_state: "Waiting for state..."
    title: " Connection "
    title_unavailable: " obsctl — daemon unavailable "

  # --- TUI widget layer ---------------------------------------------------
  # Everything the dashboard panels draw. A key ending in `_ascii` is the
  # plain-ASCII spelling of the key above it, for terminals that cannot show
  # arrows, box drawing or typographic punctuation. Widgets pick between such
  # a pair with `chrome::phrase`, which asks `advanced_ui` — whether the
  # terminal can draw Unicode at all — so the two keys must stay adjacent and
  # describe the same thing. `TuiModel::symbol`, which asks the separate
  # `show_icons` switch, is for inline pictogram literals in the widgets
  # (`model.symbol("🎬", "S")`) and never for a key in this file. Keep this
  # whole block in the same key order in contrib/locales/uk.yml.

  audio:
    title: "Audio Matrix"
    hint: "[a]  ↑↓ gain  m mute"
    hint_ascii: "[a]  ^v gain  m mute"
    no_inputs: "no audio inputs"
    too_narrow: "too narrow"
    # OBS reports -inf dB for a fader pulled all the way down.
    gain_silent: "-inf dB"
    muted: "mute"

  stats:
    title: "Stats // Stream Health"
    hint: "frames"
    waiting_for_metrics: "waiting for OBS metrics…"
    # Which frame counters the drop rows are counting: the current broadcast,
    # or everything since OBS itself started.
    scope_this_stream: "this stream"
    scope_since_launch: "since launch"
    row_render: "RENDER"
    row_output: "OUTPUT"
    verdict_healthy: "HEALTHY"
    verdict_healthy_detail: "encoder keeping up with OBS"
    verdict_strained: "STRAINED"
    verdict_strained_detail: "frames are starting to slip"
    verdict_dropping: "DROPPING"
    verdict_dropping_detail: "reduce bitrate or scene load"
    verdict_measuring: "MEASURING"
    verdict_measuring_detail: "collecting samples"

  panels:
    scenes:
      title: "Scenes"
      hint: "[s]  ↵ switch  ·  P profile"
      hint_ascii: "[s]  Enter switch  |  P profile"
      badge_profile: "%{name} — %{count} hidden"
      badge_filtered: "%{count} hidden"
      badge_profile_empty: "%{name} — nothing hidden"
      all_hidden_by_profile: "scene profile %{name} hides every scene — press P for the next profile, or <space>P then c to switch it off"
      all_hidden: "every scene is hidden by config — press P to try a scene profile"

    profiles:
      title: "Profiles"
      hint: "[p]  ↵ switch"
      hint_ascii: "[p]  Enter switch"

    collections:
      title: "Collections"
      hint: "[c]  ↵ switch"
      hint_ascii: "[c]  Enter switch"

    logs:
      title: "Logs // Event Stream"
      hint_following: "live daemon feed"
      hint_scrolled_back: "↑ scrolled back  wheel/Esc to follow"
      hint_scrolled_back_ascii: "^ scrolled back  wheel/Esc to follow"

    live_bar:
      title: "LIVE TELEMETRY"
      no_active_scene: "no active scene"
      telemetry_idle: "telemetry idle — no CPU or memory samples yet"
      telemetry_waiting: "telemetry waiting…"

    palette:
      title: "Command Palette"
      hint_typing: "type command  ↵ run  ⇥ complete  esc close"
      hint_typing_ascii: "type command  Enter run  Tab complete  Esc close"
      hint_idle: ": open  <space> which-key  q quit"
      keys: "  ◈  : command  │  <space> which-key  │  gg/G jump  │  ⇥ pane  │  q quit"
      keys_ascii: "  >  : command  |  <space> which-key  |  gg/G jump  |  Tab pane  |  q quit"
      no_completions: "  no completions"

    settings:
      title: " ⚙ Settings // Appearance Lab // ↑↓/jk preview · Enter apply · Esc cancel "
      title_ascii: " Settings // Appearance // arrows preview | Enter apply | Esc cancel "
      themes: " Themes // %{count} palettes "
      preview: " Preview: %{theme} "
      preview_heading: "◈ OBSCTL // THEME PREVIEW"
      preview_heading_ascii: "OBSCTL // THEME PREVIEW"

    # The scene-profile editor (<Space>P). "Scene profile" is an obsctl
    # concept — a named set of scene-visibility choices — and never the OBS
    # profile the Profiles panel above lists.
    scene_profiles:
      title: "Scene Profiles"
      title_new: "New Scene Profile"
      title_editing: "Editing: %{name}"
      new_entry: "＋ new scene profile"
      new_entry_ascii: "+ new scene profile"
      empty: "no scene profiles yet — press Enter to make one"
      active_marker: "★ active"
      active_marker_ascii: "* active"
      hidden_count: "%{count} hidden"
      hidden_count_partial: "%{count} of %{listed} hidden"
      new_row_selected: "that row makes a new scene profile — press ↵ to start one"
      new_row_selected_ascii: "that row makes a new scene profile - press Enter to start one"
      name_prompt: "name: "
      name_blank: "a scene profile needs a name"
      name_taken: "another scene profile is already called that"
      hint_picker: "↑↓ move · ↵ edit · a activate · c clear · d delete · esc close"
      hint_picker_ascii: "jk move | Enter edit | a activate | c clear | d delete | Esc close"
      hint_confirm_delete: "delete “%{name}”? · y delete · n/esc keep"
      hint_confirm_delete_ascii: "delete \"%{name}\"? | y delete | n/Esc keep"
      delete_asked: "delete scene profile “%{name}”? press y to delete it, n to keep it"
      delete_asked_ascii: "delete scene profile \"%{name}\"? press y to delete it, n to keep it"
      delete_cancelled: "scene profile kept: %{name}"
      hint_scenes: "↑↓ move · t hide/show · n rename · ↵ save · esc back"
      hint_scenes_ascii: "jk move | t hide/show | n rename | Enter save | Esc back"
      hint_naming: "type a name · ↵ accept · esc cancel"
      hint_naming_ascii: "type a name | Enter accept | Esc cancel"
      state_hidden: "hidden"
      state_visible: "visible"
      state_missing: "not a scene OBS has — press t to drop it"
      state_missing_ascii: "not a scene OBS has - press t to drop it"
      activated: "scene profile on: %{name} - hiding %{count} scenes"
      saved: "scene profile saved: %{name} (hides %{count} scenes) - it is not the active one, so the scene list is unchanged"
      saved_active: "scene profile saved: %{name} - it is the active one, so the scene list now hides %{count} scenes"
      saved_and_activated: "scene profile created and switched on: %{name} - hiding %{count} scenes"
      activation_failed: "scene profile saved: %{name}, but switching to it failed (%{error})"
      cleared: "scene profile off - each scene's own hidden setting decides again"
      warnings_suffix: "(%{count} config warnings - see the log panel)"
      none_defined: "no scene profiles are defined - press <space>P to make one"

  # Status-bar lines produced by the action dispatcher (`tui::actions`).
  actions:
    reconnected: "Reconnected to daemon."
    retry_failed: "Retry failed: %{error}"
    icons_on: "icons on"
    icons_off: "icons off"
    advanced_ui_on: "advanced UI on"
    advanced_ui_off: "advanced UI off"
    theme_set: "theme set: %{theme}"
    theme_applied_no_config: "theme applied (no config file to persist to)"
    theme_applied_read_failed: "theme applied, but reading config failed: %{error}"
    theme_applied_save_failed: "theme applied, but saving config failed: %{error}"

  # Event-loop reports about the IPC session itself (`tui::app`).
  session:
    cannot_connect: "Cannot connect to daemon: %{error}"
    daemon_disconnected: "Daemon disconnected: %{error}"

  # One-line renderings of daemon replies and of the checks that stop a
  # payload before it reaches the wire (`tui::daemon`). The command palette
  # colors a status line by its literal "error" prefix, so every failure
  # line here has to keep that prefix.
  daemon:
    help_line: "Commands: %{commands}  —  <space> opens the which-key menu"
    ok: "ok"
    reply_error: "error: %{error}"
    reply_error_bare: "error"
    reply_error_with_code: "error [%{code}]: %{message}"
    unexpected_response: "unexpected response"
    volume_out_of_range: "volume percent must be 0-100"
    invalid_target: "error: invalid target: %{error}"
    invalid_scene_name: "error: invalid scene name: %{error}"
    too_many_hidden_scenes: "error: a scene profile may hide at most %{max} scenes"
    volume_set: "volume → %{percent}%"
    not_a_daemon_command: "not a daemon command"

  # Theme names that describe rather than name (brand palettes such as Nord
  # or Dracula are proper nouns and stay untranslated) (`tui::theme`).
  theme:
    mono: "Mono (TTY-safe)"
    custom: "Custom"

  # Rows of the which-key overlay: one short description per mapping
  # (`tui::keymap`). The group keys double as the heading of the submenu
  # they open.
  whichkey:
    g:
      top_of_list: "top of list"
    leader:
      find: "find"
      panel: "panel"
      stream: "stream"
      config: "config"
      obs: "obs"
      ui: "ui"
      scene_profiles: "scene profiles"
      next_scene_profile: "next scene profile"
      command_palette: "command palette"
      quit: "quit"
    find:
      scene: "scene"
      profile: "profile"
      scene_profile: "scene profile"
      collection: "collection"
      audio_input: "audio input"
    panel:
      scenes: "scenes"
      audio: "audio"
      profiles: "profiles"
      collections: "collections"
    stream:
      toggle_stream: "toggle stream"
      toggle_record: "toggle record"
    config:
      reload: "reload config"
      dump: "dump config from OBS"
      validate: "validate config"
    obs:
      reconnect_obs: "reconnect to OBS"
      obs_status: "OBS status"
      daemon_status: "daemon status"
      reconnect_daemon: "reconnect to daemon"
    ui:
      theme_picker: "theme picker"
      toggle_icons: "toggle icons"
      toggle_advanced: "toggle advanced UI"
