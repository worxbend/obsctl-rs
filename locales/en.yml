# Default English strings, embedded into the obsctl binary at compile time.
#
# This file is the ultimate fallback: if no locale override files are found
# under `<config_dir>/locales/`, these strings are always used regardless of
# the configured `ui.locale`. See contrib/locales/uk.yml for the Ukrainian
# translation shipped alongside the binary (copy it into `<config_dir>/locales/`
# to enable it) and README.md's "Localization" section for details.

common:
  error: "error: %{message}"
  warning: "warning: %{message}"

cli:
  init:
    no_config_dir: "could not determine config directory"
    already_exists: "Config already exists at %{path}. Use --force to overwrite."
    success: "Initialized config at %{path}"

  validate:
    no_config_path: "could not determine config path"
    valid: "Config is valid."
    valid_with_warnings: "Config is valid with %{count} warning(s)."

  setup:
    no_config_found: "No config found at %{path}."
    create_minimal: "Let's create a minimal config.\n\n"
    failed: "Setup failed: %{error}"
    written: "\nConfig written to %{path}.\n\n"
    prompt_host: "OBS host"
    prompt_port: "OBS port"
    prompt_password: "OBS WebSocket password (blank = no auth)"
    port_out_of_range: "  Port must be in range 1-65535."
    port_invalid: "  Invalid port, enter an integer 1-65535."

  tui:
    error: "tui error: %{error}"

  runtime:
    async_start_failed: "failed to start async runtime for %{context}: %{error}"

  service:
    no_unit_dir: "could not determine systemd user unit directory"
    installed: "Service installed at %{path}"
    enable_hint: "Enable with: %{hint}"
    uninstalled: "Service uninstalled."
    action_started: "Service started."
    action_stopped: "Service stopped."
    action_restarted: "Service restarted."

  proxy:
    unsupported_command: "command %{command} is not supported for server proxying"

  client:
    server_unavailable_intro: "obsctl server is not running."
    server_unavailable_start: "Start it with:"
    server_unavailable_or_install: "Or install the service:"
    unexpected_event: "unexpected event instead of response"
    json_encode_warning: "failed to encode JSON output: %{error}"
    error_with_code: "error [%{code}]: %{message}"

tui:
  status:
    title: "STATUS"
    idle_hint: "standing by"

  splash:
    preparing: "Preparing..."

  header:
    daemon_connected: "daemon: connected"
    daemon_disconnected: "daemon: disconnected"
    obs_connected: "OBS: connected (v%{version})"
    obs_disconnected: "OBS: disconnected"
    scene: "  scene: %{scene}"
    profile: "  profile: %{profile}"

  events:
    undecodable_state: "Ignored a state update this build cannot read: %{error}"
    undecodable_log: "Ignored an unreadable log event: %{error}"
    undecodable_event: "Ignored an unreadable OBS event: %{error}"

  connection:
    daemon_not_running: "obsctl server is not running"
    could_not_connect: "Could not connect to obsctl daemon."
    start_daemon_with: "Start the daemon with:"
    or_install_service: "Or install the service:"
    press_r_to_retry: "Press R to retry, q to quit."
    not_connected: "Not connected to obsctl daemon."
    obs_connected: "OBS: connected"
    obs_disconnected: "OBS: disconnected"
    last_error: "last error: %{error}"
    waiting_for_state: "Waiting for state..."
    title: " Connection "
    title_unavailable: " obsctl — daemon unavailable "

  # --- TUI widget layer ---------------------------------------------------
  # Everything the dashboard panels draw. A key ending in `_ascii` is the
  # plain-ASCII spelling of the key above it, for terminals that cannot show
  # arrows, box drawing or emoji. The widget picks between the pair with
  # `TuiModel::symbol` where the difference is a pictogram, and with
  # `chrome::glyph` where it is box drawing — so the two keys must stay
  # adjacent and describe the same thing. Keep this whole block in the same
  # key order in contrib/locales/uk.yml.

  audio:
    title: "Audio Matrix"
    hint: "[a]  ↑↓ gain  m mute"
    hint_ascii: "[a]  ^v gain  m mute"
    no_inputs: "no audio inputs"
    too_narrow: "too narrow"
    # OBS reports -inf dB for a fader pulled all the way down.
    gain_silent: "-inf dB"
    muted: "mute"

  stats:
    title: "Stats // Stream Health"
    hint: "frames"
    waiting_for_metrics: "waiting for OBS metrics…"
    # Which frame counters the drop rows are counting: the current broadcast,
    # or everything since OBS itself started.
    scope_this_stream: "this stream"
    scope_since_launch: "since launch"
    row_render: "RENDER"
    row_output: "OUTPUT"
    verdict_healthy: "HEALTHY"
    verdict_healthy_detail: "encoder keeping up with OBS"
    verdict_strained: "STRAINED"
    verdict_strained_detail: "frames are starting to slip"
    verdict_dropping: "DROPPING"
    verdict_dropping_detail: "reduce bitrate or scene load"
    verdict_measuring: "MEASURING"
    verdict_measuring_detail: "collecting samples"

  panels:
    scenes:
      title: "Scenes"
      hint: "[s]  ↵ switch"
      hint_ascii: "[s]  Enter switch"

    profiles:
      title: "Profiles"
      hint: "[p]  ↵ switch"
      hint_ascii: "[p]  Enter switch"

    collections:
      title: "Collections"
      hint: "[c]  ↵ switch"
      hint_ascii: "[c]  Enter switch"

    logs:
      title: "Logs // Event Stream"
      hint_following: "live daemon feed"
      hint_scrolled_back: "↑ scrolled back  wheel/Esc to follow"
      hint_scrolled_back_ascii: "^ scrolled back  wheel/Esc to follow"

    live_bar:
      title: "LIVE TELEMETRY"
      no_active_scene: "no active scene"
      telemetry_idle: "telemetry idle — no CPU or memory samples yet"
      telemetry_waiting: "telemetry waiting…"

    palette:
      title: "Command Palette"
      hint_typing: "type command  ↵ run  ⇥ complete  esc close"
      hint_typing_ascii: "type command  Enter run  Tab complete  Esc close"
      hint_idle: ": open  <space> which-key  q quit"
      keys: "  ◈  : command  │  <space> which-key  │  gg/G jump  │  ⇥ pane  │  q quit"
      keys_ascii: "  >  : command  |  <space> which-key  |  gg/G jump  |  Tab pane  |  q quit"
      no_completions: "  no completions"

    settings:
      title: " ⚙ Settings // Appearance Lab // ↑↓/jk preview · Enter apply · Esc cancel "
      title_ascii: " Settings // Appearance // arrows preview | Enter apply | Esc cancel "
      themes: " Themes // %{count} palettes "
      preview: " Preview: %{theme} "
      preview_heading: "◈ OBSCTL // THEME PREVIEW"
      preview_heading_ascii: "OBSCTL // THEME PREVIEW"
