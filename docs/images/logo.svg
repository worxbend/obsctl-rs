<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="obsctl logo">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C59E"/>
      <stop offset="0.55" stop-color="#D97757"/>
      <stop offset="1" stop-color="#C25B3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- terminal card -->
  <rect x="24" y="24" width="352" height="352" rx="72" fill="#1B1916"/>
  <rect x="24" y="24" width="352" height="352" rx="72" fill="url(#glow)"/>
  <rect x="25.5" y="25.5" width="349" height="349" rx="70.5" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- titlebar dots -->
  <circle cx="78" cy="80" r="9" fill="#E06C5F"/>
  <circle cx="108" cy="80" r="9" fill="#E0B44C"/>
  <circle cx="138" cy="80" r="9" fill="#87B37B"/>

  <!-- broadcast signal arcs -->
  <g fill="none" stroke="url(#accentGrad)" stroke-linecap="round">
    <path d="M236 150 A70 70 0 0 1 236 250" stroke-width="10" opacity="0.9"/>
    <path d="M272 128 A108 108 0 0 1 272 272" stroke-width="9" opacity="0.55"/>
    <path d="M308 106 A146 146 0 0 1 308 294" stroke-width="8" opacity="0.28"/>
  </g>

  <!-- record dot -->
  <circle cx="176" cy="200" r="30" fill="#E06C5F" filter="url(#soft)" opacity="0.55"/>
  <circle cx="176" cy="200" r="26" fill="#E06C5F"/>
  <circle cx="176" cy="200" r="26" fill="none" stroke="#F0A79E" stroke-width="2" opacity="0.7"/>

  <!-- prompt chevron + cursor -->
  <path d="M92 168 L120 200 L92 232" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- segmented dB meter -->
  <g>
    <rect x="88"  y="300" width="20" height="26" rx="4" fill="#87B37B"/>
    <rect x="116" y="288" width="20" height="38" rx="4" fill="#87B37B"/>
    <rect x="144" y="276" width="20" height="50" rx="4" fill="#E0B44C"/>
    <rect x="172" y="288" width="20" height="38" rx="4" fill="#E0B44C" opacity="0.5"/>
    <rect x="200" y="300" width="20" height="26" rx="4" fill="#E06C5F" opacity="0.35"/>
    <rect x="228" y="308" width="20" height="18" rx="4" fill="#E06C5F" opacity="0.25"/>
  </g>
</svg>
